<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simon Says — Неоновый космос</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="game__header">
      <h1 class="game__title">SIMON<span>SAYS</span></h1>
      <p class="game__subtitle">Неоновый космос</p>
    </header>

    <div class="game__hud">
      <div class="hud-item">
        <span class="hud-label">Уровень</span>
        <span class="hud-value" id="level">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Рекорд</span>
        <span class="hud-value" id="best">0</span>
      </div>
    </div>

    <div class="game__board" id="board">
      <button class="pad pad--violet" data-index="0" aria-label="Фиолетовый сектор"></button>
      <button class="pad pad--cyan"   data-index="1" aria-label="Голубой сектор"></button>
      <button class="pad pad--lime"   data-index="2" aria-label="Лаймовый сектор"></button>
      <button class="pad pad--amber"  data-index="3" aria-label="Янтарный сектор"></button>
      <div class="game__core">
        <button class="start-btn" id="startBtn">СТАРТ</button>
        <p class="game__status" id="status">Нажми «Старт»</p>
      </div>
    </div>

    <p class="game__hint">Повтори последовательность, которую покажет космос</p>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
