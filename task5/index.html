<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simon Synthesizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="room">
    <div class="synth">

      <div class="synth__top">
        <div class="synth__screen-wrap">
          <div class="synth__screen" id="screen">
            <span class="screen__label">DISPLAY</span>
            <span class="screen__color" id="screenColor">READY</span>
            <span class="screen__sub" id="screenSub">нажми RESET</span>
          </div>
        </div>

        <div class="synth__controls">
          <div class="hud-block">
            <div class="hud-block__row">
              <span class="hud-block__label">LVL</span>
              <span class="hud-block__value" id="level">0</span>
            </div>
            <div class="hud-block__row">
              <span class="hud-block__label">BEST</span>
              <span class="hud-block__value" id="best">0</span>
            </div>
          </div>
        </div>
      </div>

      <div class="synth__keybed" id="keybed">
        <button class="key key--red"    data-index="0" data-color="RED">
          <span class="key__top"></span>
          <span class="key__label">RED</span>
        </button>
        <button class="key key--blue"   data-index="1" data-color="BLUE">
          <span class="key__top"></span>
          <span class="key__label">BLUE</span>
        </button>
        <button class="key key--green"  data-index="2" data-color="GREEN">
          <span class="key__top"></span>
          <span class="key__label">GREEN</span>
        </button>
        <button class="key key--yellow" data-index="3" data-color="YELLOW">
          <span class="key__top"></span>
          <span class="key__label">YELLOW</span>
        </button>
        <button class="key key--purple" data-index="4" data-color="PURPLE">
          <span class="key__top"></span>
          <span class="key__label">PURPLE</span>
        </button>
      </div>

      <div class="synth__bottom">
        <button class="start-btn" id="startBtn">RESET</button>
        <span class="synth__brand">SIMON&nbsp;SYNTH&nbsp;·&nbsp;MODEL&nbsp;5</span>
      </div>

    </div>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
