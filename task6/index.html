<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e1116">
  <title>Змейка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app__head">
      <h1 class="app__title">Змейка</h1>
      <div class="app__hud">
        <span>Счёт: <b id="score">0</b></span>
        <span>Рекорд: <b id="best">0</b></span>
      </div>
    </header>

    <div class="stage">
      <canvas id="game" width="600" height="600"></canvas>

      <div class="overlay" id="overlay">
        <div class="overlay__title" id="overlayTitle">Готовы?</div>
        <div class="overlay__text" id="overlayText">Управление — стрелки или WASD</div>
        <button class="overlay__btn" id="startBtn" type="button">Начать</button>
      </div>
    </div>

    <p class="app__hint">Пробел — пауза · R — заново</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
