<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo-list</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <h1>Список задач</h1>

    <form class="add-form" id="add-form">
      <input type="text" id="task-input" placeholder="Что нужно сделать?" autocomplete="off">
      <button type="submit">Добавить</button>
    </form>

    <p class="stats" id="stats">Осталось: 0, Выполнено: 0</p>

    <div class="filters" id="filters">
      <button class="filter active" data-filter="all">Все</button>
      <button class="filter" data-filter="active">Активные</button>
      <button class="filter" data-filter="completed">Завершённые</button>
    </div>

    <ul class="task-list" id="task-list"></ul>
    <p class="empty" id="empty" hidden>Список пуст</p>
  </main>
</body>
</html>
